<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruwan AI — Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f7f4ee;
    --panel: #ffffff;
    --ink: #2a3540;
    --ink-soft: #5a6570;
    --mist: #b9cfe8;
    --mist-deep: #6f97c9;
    --line: #e2ddd0;
    --bubble-user: #eaf1fb;
    --bubble-ai: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    top: -120px;
    left: 50%;
    width: 480px;
    height: 480px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(143,180,227,0.22) 0%, rgba(143,180,227,0) 68%);
    pointer-events: none;
    z-index: 0;
  }

  header, main, footer {
    position: relative;
    z-index: 1;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    gap: 10px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }

  .hamburger-btn {
    background: none;
    border: none;
    color: var(--ink);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .hamburger-btn:hover {
    background: rgba(111,151,201,0.12);
  }

  .hamburger-btn svg {
    width: 20px;
    height: 20px;
  }

  .user-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--mist-deep);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    overflow: hidden;
  }

  .user-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .user-name {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 13.5px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 130px;
  }

  .header-controls {
    display: flex;
    gap: 8px;
  }

  .header-controls select {
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 6px 12px;
    outline: none;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 10;
  }

  .sidebar-overlay.open {
    display: block;
  }

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: 270px;
    max-width: 82%;
    background: var(--panel);
    border-right: 1px solid var(--line);
    z-index: 11;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar-header {
    padding: 16px 14px 12px;
    border-bottom: 1px solid var(--line);
  }

  .sidebar-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 17px;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .new-chat-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--mist-deep);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
  }

  .new-chat-btn svg {
    width: 16px;
    height: 16px;
  }

  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .sidebar-empty {
    padding: 16px 10px;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-align: center;
  }

  .chat-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-item:hover {
    background: var(--paper);
  }

  .chat-item.active {
    background: rgba(111,151,201,0.15);
    color: var(--mist-deep);
    font-weight: 500;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  .msg {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--ink);
    border-bottom-right-radius: 4px;
  }

  .msg.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    border: 1px solid var(--line);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }

  .empty-state {
    margin: 36px auto 0;
    text-align: center;
    color: var(--ink-soft);
    max-width: 300px;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 30px 26px;
    box-shadow: 0 14px 34px rgba(111,151,201,0.16);
  }

  .empty-mark {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 24px;
    letter-spacing: 4px;
    color: var(--mist-deep);
    text-shadow: 0 0 12px rgba(111,151,201,0.3);
    margin-top: 16px;
  }

  .empty-state h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 22px;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .empty-state p {
    font-size: 14px;
    line-height: 1.6;
  }

  footer {
    padding: 12px 14px 18px;
    background: var(--panel);
    border-top: 1px solid var(--line);
  }

  .mode-row {
    display: none;
  }

  .active-mode-tag {
    max-width: 640px;
    margin: 0 auto 8px;
    font-size: 11.5px;
    color: var(--mist-deep);
    text-align: center;
    opacity: 0.85;
    min-height: 14px;
  }

  .attachment-preview {
    max-width: 640px;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 10px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .attachment-preview img {
    width: 32px;
    height: 32px;
    object-fit: cover;
    border-radius: 6px;
  }

  .attachment-preview .remove-att {
    margin-left: auto;
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 15px;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .icon-btn:hover {
    background: rgba(111,151,201,0.12);
    color: var(--mist-deep);
  }

  .icon-btn.active {
    color: var(--mist-deep);
    background: rgba(111,151,201,0.15);
  }

  .icon-btn svg {
    width: 19px;
    height: 19px;
  }

  .icon-btn.recording {
    color: #d9534f;
    background: rgba(217,83,79,0.12);
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .input-row {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 8px 8px 8px 16px;
  }

  textarea {
    flex: 1;
    border: none;
    background: transparent;
    resize: none;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    outline: none;
    max-height: 120px;
    line-height: 1.5;
    padding: 6px 0;
  }

  textarea::placeholder {
    color: var(--ink-soft);
  }

  button.send {
    background: var(--mist-deep);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s ease;
  }

  button.send:disabled {
    opacity: 0.45;
    cursor: default;
  }

  button.send svg {
    width: 16px;
    height: 16px;
  }

  @keyframes floatDot2 {
    0%, 100% { transform: translateY(0px); opacity: 0.5; }
    50% { transform: translateY(-4px); opacity: 1; }
  }
  .fd { animation: floatDot2 1.4s ease-in-out infinite; transform-origin: center; }
  .fd:nth-child(2) { animation-delay: 0.18s; }
  .fd:nth-child(3) { animation-delay: 0.36s; }

  @keyframes gentleBob {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-2px); }
  }
  .mascotBob { animation: gentleBob 2s ease-in-out infinite; transform-origin: center; }

  .thinking-mascot {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 10px 16px;
    width: fit-content;
    align-self: flex-start;
  }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">Ruwan AI</div>
    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      New Chat
    </button>
  </div>
  <div class="sidebar-list" id="sidebarList">
    <div class="sidebar-empty">Loading...</div>
  </div>
</div>

<header>
  <button class="hamburger-btn" id="hamburgerBtn" title="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>
  <div class="brand" id="userBrand">
    <span class="user-avatar" id="userAvatar">?</span>
    <span class="user-name" id="userName">...</span>
  </div>
  <div class="header-controls">
    <select id="languageSelect">
      <option value="auto">Auto</option>
      <option value="hindi">Hindi</option>
      <option value="english">English</option>
    </select>
  </div>
</header>

<main id="chatMain">
  <div class="empty-state" id="emptyState">
    <p>Seedha, honest aur anti-addictive AI madad — apni bhasha mein, apne andaaz mein.</p>
    <div class="empty-mark">RUWAN AI</div>
  </div>
</main>

<footer>
  <div class="active-mode-tag" id="activeModeTag"></div>
  <div id="attachmentPreview"></div>
  <div class="input-row">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="attachInput" accept="image/*,.txt,.pdf,.doc,.docx" style="display:none">

    <button class="icon-btn" id="attachBtn" title="File attach karo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
    </button>

    <button class="icon-btn" id="cameraBtn" title="Camera se photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>

    <textarea id="messageInput" placeholder="Apna sawaal likhein..." rows="1"></textarea>

    <button class="icon-btn" id="micBtn" title="Bolke poochein">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
    </button>

    <button class="icon-btn" id="voiceOutBtn" title="AI ki awaaz on/off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>
    </button>

    <button class="send" id="sendBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"></line>
        <polyline points="6 11 12 5 18 11"></polyline>
      </svg>
    </button>
  </div>
</footer>

<script>
  const idToken = localStorage.getItem('ruwanIdToken');
  if (!idToken) {
    window.location.href = '/';
  }

  const chatMain = document.getElementById('chatMain');
  const emptyState0 = document.getElementById('emptyState');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const languageSelect = document.getElementById('languageSelect');
  const activeModeTag = document.getElementById('activeModeTag');
  const attachBtn = document.getElementById('attachBtn');
  const cameraBtn = document.getElementById('cameraBtn');
  const micBtn = document.getElementById('micBtn');
  const voiceOutBtn = document.getElementById('voiceOutBtn');
  const attachInput = document.getElementById('attachInput');
  const cameraInput = document.getElementById('cameraInput');
  const attachmentPreview = document.getElementById('attachmentPreview');

  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const newChatBtn = document.getElementById('newChatBtn');
  const sidebarList = document.getElementById('sidebarList');

  let messages = [];
  let pendingAttachment = null;
  let voiceOutputOn = false;
  let currentChatId = null;

  // ---------- SIDEBAR LOGIC ----------
  function openSidebar() {
    sidebar.classList.add('open');
    sidebarOverlay.classList.add('open');
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('open');
  }
  hamburgerBtn.addEventListener('click', openSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);

  async function loadChatList() {
    try {
      const res = await fetch('/api/chats?idToken=' + encodeURIComponent(idToken));
      const data = await res.json();
      if (!res.ok) return;
      renderChatList(data.chats || []);
    } catch (err) {
      console.error('Load chat list error:', err);
    }
  }

  function renderChatList(chats) {
    if (!chats.length) {
      sidebarList.innerHTML = '<div class="sidebar-empty">Koi purani chat nahi hai</div>';
      return;
    }
    sidebarList.innerHTML = '';
    chats.forEach((chat) => {
      const btn = document.createElement('button');
      btn.className = 'chat-item' + (chat._id === currentChatId ? ' active' : '');
      btn.textContent = chat.title || 'New Chat';
      btn.addEventListener('click', () => loadChat(chat._id));
      sidebarList.appendChild(btn);
    });
  }

  async function loadChat(chatId) {
    try {
      const res = await fetch('/api/chats/' + chatId + '?idToken=' + encodeURIComponent(idToken));
      const data = await res.json();
      if (!res.ok || !data.chat) return;

      currentChatId = chatId;
      messages = data.chat.messages.map((m) => ({ role: m.role, content: m.content }));
      renderFullChat();
      closeSidebar();
      loadChatList();
    } catch (err) {
      console.error('Load chat error:', err);
    }
  }

  function renderFullChat() {
    chatMain.innerHTML = '';
    if (messages.length === 0) {
      chatMain.innerHTML =
        '<div class="empty-state" id="emptyState">' +
          '<p>Seedha, honest aur anti-addictive AI madad — apni bhasha mein, apne andaaz mein.</p>' +
          '<div class="empty-mark">RUWAN AI</div>' +
        '</div>';
      return;
    }
    messages.forEach((m) => {
      const div = document.createElement('div');
      div.className = 'msg ' + (m.role === 'user' ? 'user' : 'ai');
      div.textContent = m.content;
      chatMain.appendChild(div);
    });
    chatMain.scrollTop = chatMain.scrollHeight;
  }

  function startNewChat() {
    currentChatId = null;
    messages = [];
    renderFullChat();
    closeSidebar();
    loadChatList();
  }
  newChatBtn.addEventListener('click', startNewChat);

  loadChatList();

  // ---------- 1. AUTOMATIC MODE DETECTION (keyword based) ----------
  const MODE_KEYWORDS = {
    navigation: ['route', 'kaise jau', 'kaise jaun', 'metro', 'bus se', 'airport', 'station', 'address', 'location', 'direction', 'road', 'nearest', 'paas mein'],
    college: ['admission', 'college', 'university', 'entrance exam', 'eligibility', 'scholarship', 'fees', 'deadline', 'application form'],
    career: ['career', 'job', 'resume', 'interview', 'skill', 'course', 'roadmap', 'salary', 'internship'],
    professional: ['business', 'company', 'client', 'email likho', 'report banao', 'meeting', 'proposal', 'marketing'],
    learning: ['padhna', 'homework', 'exam', 'subject', 'explain', 'samjhao', 'notes banao', 'mcq', 'quiz', 'flashcard', 'concept'],
    research: ['research', 'compare karo', 'analysis', 'detailed', 'latest news', 'study batao', 'sources', 'in depth']
  };

  function detectMode(text) {
    const lower = text.toLowerCase();
    for (const mode in MODE_KEYWORDS) {
      if (MODE_KEYWORDS[mode].some(kw => lower.includes(kw))) {
        return mode;
      }
    }
    return 'general';
  }

  const MODE_LABELS = {
    general: '',
    professional: 'Professional mode',
    college: 'College mode',
    research: 'Research mode (web search on)',
    navigation: 'Navigation mode',
    career: 'Career mode',
    learning: 'Learning mode'
  };

  // ---------- 2. VOICE INPUT (Speech to Text) ----------
  let recognition = null;
  let isRecording = false;
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognitionAPI) {
    recognition = new SpeechRecognitionAPI();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'hi-IN';

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      messageInput.value = (messageInput.value + ' ' + transcript).trim();
      messageInput.dispatchEvent(new Event('input'));
    };

    recognition.onend = () => {
      isRecording = false;
      micBtn.classList.remove('recording');
    };

    recognition.onerror = () => {
      isRecording = false;
      micBtn.classList.remove('recording');
    };
  }

  micBtn.addEventListener('click', () => {
    if (!recognition) {
      alert('Ye browser voice input support nahi karta. Chrome try karein.');
      return;
    }
    if (isRecording) {
      recognition.stop();
      isRecording = false;
      micBtn.classList.remove('recording');
    } else {
      recognition.start();
      isRecording = true;
      micBtn.classList.add('recording');
    }
  });

  // ---------- 3. VOICE OUTPUT (Text to Speech) ----------
  function speak(text) {
    if (!voiceOutputOn || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'hi-IN';
    window.speechSynthesis.speak(utter);
  }

  voiceOutBtn.addEventListener('click', () => {
    voiceOutputOn = !voiceOutputOn;
    voiceOutBtn.classList.toggle('active', voiceOutputOn);
    if (!voiceOutputOn) window.speechSynthesis.cancel();
  });

  // ---------- 4. CAMERA & ATTACHMENT ----------
  cameraBtn.addEventListener('click', () => cameraInput.click());
  attachBtn.addEventListener('click', () => attachInput.click());

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleFileSelect(file) {
    if (!file) return;

    if (file.type === 'text/plain') {
      const text = await file.text();
      messageInput.value += (messageInput.value ? '\n\n' : '') + '[Attached file: ' + file.name + ']\n' + text;
      messageInput.dispatchEvent(new Event('input'));
      return;
    }

    if (file.type.startsWith('image/')) {
      const base64 = await fileToBase64(file);
      pendingAttachment = { mimeType: file.type, data: base64, name: file.name };
      renderAttachmentPreview(URL.createObjectURL(file));
      return;
    }

    alert('PDF/DOC files abhi directly nahi padhi ja sakti. Image ya .txt file try karein.');
  }

  function renderAttachmentPreview(imgUrl) {
    attachmentPreview.innerHTML =
      '<div class="attachment-preview">' +
        '<img src="' + imgUrl + '" alt="">' +
        '<span>Photo attach ki gayi hai</span>' +
        '<span class="remove-att" id="removeAttBtn">✕</span>' +
      '</div>';
    document.getElementById('removeAttBtn').addEventListener('click', () => {
      pendingAttachment = null;
      attachmentPreview.innerHTML = '';
    });
  }

  cameraInput.addEventListener('change', (e) => handleFileSelect(e.target.files[0]));
  attachInput.addEventListener('change', (e) => handleFileSelect(e.target.files[0]));

  // ---------- Google idToken decode ----------
  function parseJwt(token) {
    try {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(
        atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
      );
      return JSON.parse(jsonPayload);
    } catch (e) {
      return null;
    }
  }

  const userInfo = parseJwt(idToken);
  const userNameEl = document.getElementById('userName');
  const userAvatarEl = document.getElementById('userAvatar');

  if (userInfo) {
    const displayName = userInfo.name || userInfo.email || 'User';
    userNameEl.textContent = displayName;
    userNameEl.title = userInfo.email || '';
    if (userInfo.picture) {
      userAvatarEl.innerHTML = '<img src="' + userInfo.picture + '" alt="">';
    } else {
      userAvatarEl.textContent = displayName.charAt(0).toUpperCase();
    }
  } else {
    userNameEl.textContent = 'User';
  }

  messageInput.addEventListener('input', () => {
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
  });

  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  function addBubble(role, text) {
    const existingEmpty = document.getElementById('emptyState');
    if (existingEmpty) existingEmpty.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
    div.textContent = text;
    chatMain.appendChild(div);
    chatMain.scrollTop = chatMain.scrollHeight;
    return div;
  }

  function addThinking() {
    const div = document.createElement('div');
    div.className = 'thinking-mascot';
    div.innerHTML =
      '<svg width="34" height="34" viewBox="0 0 120 120">' +
        '<g class="mascotBob">' +
          '<circle cx="60" cy="64" r="46" fill="#FAEEDA" stroke="#D85A30" stroke-width="2"/>' +
          '<circle cx="46" cy="58" r="3" fill="#2A3540"/>' +
          '<path d="M39 55 Q46 50 53 55" fill="none" stroke="#2A3540" stroke-width="2" stroke-linecap="round"/>' +
          '<path d="M74 55 Q81 50 88 55" fill="none" stroke="#2A3540" stroke-width="2" stroke-linecap="round"/>' +
          '<path d="M50 78 Q60 86 70 78" fill="none" stroke="#993C1D" stroke-width="2.5" stroke-linecap="round"/>' +
          '<ellipse cx="42" cy="70" rx="6" ry="4" fill="#F0997B" opacity="0.55"/>' +
          '<ellipse cx="82" cy="70" rx="6" ry="4" fill="#F0997B" opacity="0.55"/>' +
        '</g>' +
        '<circle class="fd" cx="30" cy="18" r="3" fill="#F0997B"/>' +
        '<circle class="fd" cx="45" cy="8" r="3.5" fill="#F0997B"/>' +
        '<circle class="fd" cx="62" cy="6" r="3" fill="#F0997B"/>' +
      '</svg>' +
      '<span style="font-size: 13.5px; color: var(--ink-soft);">Ruwan soch raha hai</span>';
    chatMain.appendChild(div);
    chatMain.scrollTop = chatMain.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text && !pendingAttachment) return;

    const detectedMode = detectMode(text);
    activeModeTag.textContent = MODE_LABELS[detectedMode] || '';

    messageInput.value = '';
    messageInput.style.height = 'auto';
    sendBtn.disabled = true;

    addBubble('user', text || '[Photo bheji gayi]');
    messages.push({ role: 'user', content: text || 'Is photo ko dekh kar batao.' });

    const attachmentToSend = pendingAttachment;
    pendingAttachment = null;
    attachmentPreview.innerHTML = '';

    const thinkingEl = addThinking();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: messages,
          language: languageSelect.value,
          mode: detectedMode,
          idToken: idToken,
          image: attachmentToSend,
          chatId: currentChatId
        })
      });

      const data = await res.json();
      thinkingEl.remove();

      if (!res.ok) {
        if (res.status === 401) {
          localStorage.removeItem('ruwanIdToken');
          window.location.href = '/';
          return;
        }
        addBubble('ai', data.error || 'Kuch galat ho gaya, dubara try karein.');
        return;
      }

      addBubble('ai', data.reply);
      messages.push({ role: 'assistant', content: data.reply });
      speak(data.reply);

      if (data.chatId && data.chatId !== currentChatId) {
        currentChatId = data.chatId;
      }
      loadChatList();

    } catch (err) {
      thinkingEl.remove();
      addBubble('ai', 'Connection mein dikkat aa rahi hai, dubara try karein.');
      console.error(err);
    } finally {
      sendBtn.disabled = false;
    }
  }
</script>

</body>
</html>
