<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruwan AI — Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f7f4ee;
    --panel: #ffffff;
    --ink: #2a3540;
    --ink-soft: #5a6570;
    --mist: #b9cfe8;
    --mist-deep: #6f97c9;
    --line: #e2ddd0;
    --bubble-user: #eaf1fb;
    --bubble-ai: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    top: -120px;
    left: 50%;
    width: 480px;
    height: 480px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(143,180,227,0.22) 0%, rgba(143,180,227,0) 68%);
    pointer-events: none;
    z-index: 0;
  }

  header, main, footer {
    position: relative;
    z-index: 1;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    overflow: hidden;
    box-shadow: 0 4px 12px rgba(111,151,201,0.25);
  }

  .brand-mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .brand-name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 0.2px;
  }

  .header-controls {
    display: flex;
    gap: 8px;
  }

  .header-controls select {
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 6px 12px;
    outline: none;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  .msg {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--ink);
    border-bottom-right-radius: 4px;
  }

  .msg.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    border: 1px solid var(--line);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }

  .msg.thinking {
    align-self: flex-start;
    color: var(--ink-soft);
    font-style: italic;
    font-size: 13.5px;
    padding: 4px 4px;
  }

  .empty-state {
    margin: 36px auto 0;
    text-align: center;
    color: var(--ink-soft);
    max-width: 300px;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 30px 26px;
    box-shadow: 0 14px 34px rgba(111,151,201,0.16);
  }

  .empty-mark {
    width: 46px;
    height: 46px;
    margin: 0 auto 16px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(111,151,201,0.25);
  }

  .empty-mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .empty-state h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 22px;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .empty-state p {
    font-size: 14px;
    line-height: 1.6;
  }

  footer {
    padding: 12px 14px 18px;
    background: var(--panel);
    border-top: 1px solid var(--line);
  }

  .mode-row {
    max-width: 640px;
    margin: 0 auto 10px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .mode-chip {
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 6px 13px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .mode-chip.active {
    background: var(--mist-deep);
    border-color: var(--mist-deep);
    color: #ffffff;
  }

  .input-row {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 8px 8px 8px 16px;
  }

  textarea {
    flex: 1;
    border: none;
    background: transparent;
    resize: none;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    outline: none;
    max-height: 120px;
    line-height: 1.5;
    padding: 6px 0;
  }

  textarea::placeholder {
    color: var(--ink-soft);
  }

  button.send {
    background: var(--mist-deep);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s ease;
  }

  button.send:disabled {
    opacity: 0.45;
    cursor: default;
  }

  button.send svg {
    width: 16px;
    height: 16px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-mark"><img src="logo.jpg" alt="Ruwan AI"></span>
    <span class="brand-name">Ruwan AI</span>
  </div>
  <div class="header-controls">
    <select id="languageSelect">
      <option value="auto">Auto</option>
      <option value="hindi">Hindi</option>
      <option value="english">English</option>
    </select>
  </div>
</header>

<main id="chatMain">
  <div class="empty-state" id="emptyState">
    <div class="empty-mark"><img src="logo.jpg" alt="Ruwan AI"></div>
    <h2>Kaise madad karoon?</h2>
    <p>Seedha, honest aur anti-addictive AI madad — apni bhasha mein, apne andaaz mein.</p>
  </div>
</main>

<footer>
  <div class="mode-row" id="modeRow">
    <span class="mode-chip active" data-mode="general">General</span>
    <span class="mode-chip" data-mode="professional">Professional</span>
    <span class="mode-chip" data-mode="college">College</span>
    <span class="mode-chip" data-mode="research">Research</span>
  </div>
  <div class="input-row">
    <textarea id="messageInput" placeholder="Apna sawaal likhein..." rows="1"></textarea>
    <button class="send" id="sendBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"></line>
        <polyline points="6 11 12 5 18 11"></polyline>
      </svg>
    </button>
  </div>
</footer>

<script>
  const idToken = localStorage.getItem('ruwanIdToken');
  if (!idToken) {
    window.location.href = '/';
  }

  const chatMain = document.getElementById('chatMain');
  const emptyState = document.getElementById('emptyState');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const languageSelect = document.getElementById('languageSelect');
  const modeChips = document.querySelectorAll('.mode-chip');
  let currentMode = 'general';

  modeChips.forEach(chip => {
    chip.addEventListener('click', () => {
      modeChips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentMode = chip.dataset.mode;
    });
  });

  let messages = [];

  // textarea auto-grow
  messageInput.addEventListener('input', () => {
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
  });

  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  function addBubble(role, text) {
    if (emptyState) emptyState.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
    div.textContent = text;
    chatMain.appendChild(div);
    chatMain.scrollTop = chatMain.scrollHeight;
    return div;
  }

  function addThinking() {
    const div = document.createElement('div');
    div.className = 'msg thinking';
    div.textContent = 'Ruwan soch raha hai...';
    chatMain.appendChild(div);
    chatMain.scrollTop = chatMain.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text) return;

    messageInput.value = '';
    messageInput.style.height = 'auto';
    sendBtn.disabled = true;

    addBubble('user', text);
    messages.push({ role: 'user', content: text });

    const thinkingEl = addThinking();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: messages,
          language: languageSelect.value,
          mode: currentMode,
          idToken: idToken
        })
      });

      const data = await res.json();
      thinkingEl.remove();

      if (!res.ok) {
        if (res.status === 401) {
          // sign-in expired
          localStorage.removeItem('ruwanIdToken');
          window.location.href = '/';
          return;
        }
        addBubble('ai', data.error || 'Kuch galat ho gaya, dubara try karein.');
        return;
      }

      addBubble('ai', data.reply);
      messages.push({ role: 'assistant', content: data.reply });

    } catch (err) {
      thinkingEl.remove();
      addBubble('ai', 'Connection mein dikkat aa rahi hai, dubara try karein.');
      console.error(err);
    } finally {
      sendBtn.disabled = false;
    }
  }
</script>

</body>
</html>
