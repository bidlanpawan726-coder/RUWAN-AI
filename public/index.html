<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruwan AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  :root {
    --paper: #f7f4ee;
    --ink: #2a3540;
    --ink-soft: #5a6570;
    --mist: #b9cfe8;
    --mist-deep: #6f97c9;
    --line: #e2ddd0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* soft ambient glow, echoing the heart-glow in the mark */
  body::before {
    content: "";
    position: absolute;
    top: 8%;
    left: 50%;
    width: 520px;
    height: 520px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(143,180,227,0.35) 0%, rgba(143,180,227,0) 68%);
    pointer-events: none;
  }

  main {
    position: relative;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }

  .mark {
    width: 300px;
    max-width: 85%;
    margin: 0 auto 32px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 12px 34px rgba(111,151,201,0.22);
  }

  .mark img {
    width: 100%;
    height: auto;
    display: block;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: 0.2px;
    color: var(--ink);
    margin-bottom: 10px;
  }

  p.tagline {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 280px;
    margin: 0 auto 40px;
  }

  #googleSignInDiv {
    display: flex;
    justify-content: center;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 30px 0 22px;
    color: var(--ink-soft);
    font-size: 12.5px;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .note {
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  .note a {
    color: var(--mist-deep);
    text-decoration: none;
    border-bottom: 1px solid var(--mist);
  }

  @media (prefers-reduced-motion: no-preference) {
    main {
      animation: settle 0.6s ease-out;
    }
    @keyframes settle {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }
</style>
</head>
<body>

  <main>
    <div class="mark">
      <img src="logo.jpg" alt="Ruwan AI">
    </div>

    <h1>Ruwan se milte hain</h1>
    <p class="tagline"> honest aur anti-addictive AI madad — apni bhasha mein, apne andaaz mein.</p>

    <div class="divider">shuru karne ke liye</div>

    <div id="googleSignInDiv"></div>

    <p class="note" style="margin-top: 26px;">Sign in karke aap hamari <a href="#">shartein</a> maante hain</p>
  </main>

<script>
  window.onload = function () {
    fetch('/api/config')
      .then(res => res.json())
      .then(config => {
        google.accounts.id.initialize({
          client_id: config.googleClientId,
          callback: handleCredentialResponse
        });

        google.accounts.id.renderButton(
          document.getElementById('googleSignInDiv'),
          { theme: 'outline', size: 'large', shape: 'pill', width: 260, text: 'continue_with' }
        );
      })
      .catch(err => console.error('Config load error:', err));
  };

  function handleCredentialResponse(response) {
    // idToken ko save karo taaki chat.html isse har /api/chat request ke saath bhej sake
    localStorage.setItem('ruwanIdToken', response.credential);
    window.location.href = '/chat.html';
  }
</script>

</body>
</html>
